[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "srs"
version = "0.1.0"
description = "Sequential resource-sharing branching process"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "joblib",
    "matplotlib",
    "numba",
    "numbalsoda",
    "numpy",
    "openpyxl",
    "pandas",
    "prettypyplot",
    "pyabc",
    "scipy",
    "seaborn",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["srs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
